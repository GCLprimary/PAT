[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pat"
version = "0.1.0"
description = "The shell: a creature that perceives, recalls, acts, refuses, and learns from being taught — composed from a_mem and mirror"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "a-mem>=0.2.0", "mirror>=0.1.0"]

[project.scripts]
pat = "pat.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["pat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
