[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-mem"
version = "0.2.0"
description = "Associative agent memory: normalized field stage, absolute anchor library, contraction core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["amem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
