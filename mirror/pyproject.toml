[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror"
version = "0.1.0"
description = "Reasoning core integration: ElfIX form geometry + a_mem episodic memory + the mirror loop + PPMI meaning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "a-mem>=0.2.0", "nltk>=3.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["mirror"]

[tool.pytest.ini_options]
testpaths = ["tests"]
